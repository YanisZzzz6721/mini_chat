<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Assistant">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-512.png">
<title>Assistant</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --me:#6c8cff; --txt:#e8eaf0; --mut:#8a90a0; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--txt);
    font: 16px/1.45 -apple-system, system-ui, sans-serif; }
  #app { display: flex; flex-direction: column; height: 100dvh; padding-top: env(safe-area-inset-top); }
  header { padding: 12px 16px; font-weight: 600; border-bottom: 1px solid #23262f; display: flex; justify-content: space-between; align-items: center; }
  header button { background: none; border: 0; color: var(--mut); font-size: 14px; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; -webkit-overflow-scrolling: touch; }
  .m { max-width: 85%; padding: 10px 14px; border-radius: 18px; white-space: pre-wrap; word-wrap: break-word; }
  .u { align-self: flex-end; background: var(--me); color: #fff; border-bottom-right-radius: 6px; }
  .a { align-self: flex-start; background: var(--card); border-bottom-left-radius: 6px; }
  .e { align-self: center; color: #ff8b8b; font-size: 14px; }
  form { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid #23262f; }
  textarea { flex: 1; resize: none; max-height: 120px; background: var(--card); color: var(--txt); border: 0; border-radius: 20px; padding: 10px 14px; font: inherit; }
  #send { background: var(--me); color: #fff; border: 0; border-radius: 50%; width: 44px; height: 44px; font-size: 20px; }
  #send:disabled { opacity: .4; }
  #login { display: none; margin: auto; padding: 24px; width: min(360px, 100%); text-align: center; }
  #login input { width: 100%; padding: 12px; border-radius: 12px; border: 0; background: var(--card); color: var(--txt); font-size: 16px; text-align: center; }
  #login button { margin-top: 12px; width: 100%; padding: 12px; border: 0; border-radius: 12px; background: var(--me); color: #fff; font-size: 16px; }
  #loginErr { color: #ff8b8b; min-height: 1.4em; margin-top: 8px; font-size: 14px; }
</style>
</head>
<body>
<div id="app">
  <header><span>Assistant</span><button id="reset">Nouvelle discussion</button></header>
  <div id="login">
    <p>Entre ton code d’accès</p>
    <input id="code" type="password" autocomplete="off" autocapitalize="off" placeholder="Code">
    <button id="go">Entrer</button>
    <div id="loginErr"></div>
  </div>
  <div id="log"></div>
  <form id="form">
    <textarea id="msg" rows="1" placeholder="Écris ton message…" enterkeyhint="send"></textarea>
    <button id="send" type="submit" aria-label="Envoyer">↑</button>
  </form>
</div>
<script>
const $ = (id) => document.getElementById(id);
const store = {
  get: (k) => { try { return localStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} },
  del: (k) => { try { localStorage.removeItem(k); } catch {} },
};
let code = store.get('code');
let sessionId = store.get('sid');
const newSid = () => { sessionId = crypto.randomUUID(); store.set('sid', sessionId); };
if (!sessionId) newSid();
let busy = false;

function add(cls, text) {
  const d = document.createElement('div');
  d.className = 'm ' + cls; d.textContent = text;
  $('log').appendChild(d); $('log').scrollTop = $('log').scrollHeight;
  return d;
}

function showLogin(show) {
  $('login').style.display = show ? 'block' : 'none';
  $('log').style.display = $('form').style.display = show ? 'none' : '';
  if (!show) $('log').style.display = 'flex';
}

async function checkCode(c) {
  const r = await fetch('/api/ping', { headers: { 'x-code': c } });
  return r.ok;
}

$('go').onclick = async () => {
  const c = $('code').value;
  $('loginErr').textContent = '';
  try {
    if (await checkCode(c)) { code = c; store.set('code', c); showLogin(false); }
    else $('loginErr').textContent = 'Code incorrect.';
  } catch { $('loginErr').textContent = 'Serveur injoignable.'; }
};
$('code').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('go').click(); });

$('reset').onclick = () => { newSid(); $('log').innerHTML = ''; };

$('msg').addEventListener('input', (e) => { e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px'; });

$('form').onsubmit = async (e) => {
  e.preventDefault();
  const text = $('msg').value.trim();
  if (!text || busy) return;
  busy = true; $('send').disabled = true;
  $('msg').value = ''; $('msg').style.height = 'auto';
  add('u', text);
  const bubble = add('a', '…');
  let got = false;
  try {
    const r = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-code': code },
      body: JSON.stringify({ message: text, sessionId }),
    });
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      if (r.status === 401) { store.del('code'); showLogin(true); }
      bubble.remove(); add('e', j.error || 'Erreur.');
    } else {
      const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = '';
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let i;
        while ((i = buf.indexOf('\n\n')) >= 0) {
          const line = buf.slice(0, i); buf = buf.slice(i + 2);
          if (!line.startsWith('data: ')) continue;
          const ev = JSON.parse(line.slice(6));
          if (ev.t === 'delta') { if (!got) { bubble.textContent = ''; got = true; } bubble.textContent += ev.text; $('log').scrollTop = $('log').scrollHeight; }
          else if (ev.t === 'error') { if (!got) bubble.remove(); add('e', ev.message); }
        }
      }
    }
  } catch { bubble.remove(); add('e', 'Connexion perdue, réessaie.'); }
  busy = false; $('send').disabled = false; $('msg').focus();
};

(async () => {
  if (!code) return showLogin(true);
  try { showLogin(!(await checkCode(code))); } catch { showLogin(false); }
})();
</script>
</body>
</html>
